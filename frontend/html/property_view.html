<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../../css/jquery.fancybox.min.css">
    <link rel="stylesheet" href="../../css/vendor/bootstrap-v5.3.8/bootstrap.min.css">

    <link rel="stylesheet" href="../css/property_view.css">
    <!-- Phones: up to 768px -->
    <link rel="stylesheet" href="../css/property_view_mobil.css" media="only screen and (max-width: 768px)">
    <!-- Tablets: 768px–991.98px -->
    <link rel="stylesheet" href="../css/property_view_tablet.css" media="only screen and (min-width: 768px) and (max-width: 991.98px)">
    <!-- Desktops: 992px and up -->
    <link rel="stylesheet" href="../css/property_view_desktop.css" media="only screen and (min-width: 992px)">
    <link rel="stylesheet" href="../css/property_view.css">
    <link rel="stylesheet" href="../../css/leaflet.css">

    <link rel="apple-touch-icon" sizes="180x180" href="../../img/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../img/favicon-16x16.png">
    <link rel="manifest" href="../../img/site.webmanifest">

    <script src="../../js/jquery-3.7.1.js"></script>
    <script src="../../js/jquery.fancybox.min.js"></script>
    <script src="../../js/leaflet.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/map.js"></script>
    <script src="../js/pagination.js"></script>
    <script src="../js/realtorapp.js"></script>
    <script src="../js/property_view.js"></script>
    <title>Property view</title>
</head>
<body>
  <nav>
      <div id="nav-left">
      <a href="properties_preview.html" class="btn btn-secondary" id="back-button"> back to preview</a>
      </div>
  </nav>
  <div class="page-container">
    <main id="mainSection">
      <div id="popUpContainer">
        <div id="gallery">
            <div id="mainPhotoContainer"></div>
            <div id="galleryRight"></div>
        </div>

        <div id="property">
          <div id="info">
            <div id="houseMainInfo">
              <h1>$</h1>
              <div id="price"></div>
              <div id="property_state"></div>
            </div>

            <div id="houseArea">
              <div id="number-of-rooms-section" class="houseAreaSections">
                <label for="number_of_rooms">Number of rooms: </label>
                <div id="number_of_rooms"></div>
              </div>
              <div id="number-of-bathrooms-section" class="houseAreaSections">
                <label for="number_of_bathrooms">Number of bathrooms: </label>
                <div id="number_of_bathrooms"></div>
              </div>
              <div id="area-sqft-section" class="houseAreaSections">
                <div id="area_sqft"></div>
                <div>sqft</div>
              </div>
            </div>
            <div id="houseAddress">
              <div id="address_street" class="address-item"></div>
              <div id="address_apartment" class="address-item"></div>
              <div id="address_city" class="address-item"></div>
              <div id="address_state" class="address-item"></div>
              <div id="address_zip" class="address-item"></div>
            </div>
            <div id="webData">
            <div id="enrollment_dateContent">
              <label for="enrollment_date">Listed since: </label>
              <div id="enrollment_date"></div>
            </div>
            <div id="viewsContent">
                <label for="views_count">Views: </label>
                <div id="views_count"></div>
            </div>
            <div id="description">
            </div>
          </div>

        <div id="mapAndForm">
          <div id="mapContainer">
            <div id="map"></div>
          </div>
          <div id="formContainer">
            <div id="formNotification"></div>
            <form id="contactForm" action="../../backend/php/main.php?action=sendForm" method="post">
                <p class="image-text">Contact Agent</p>
                <label for="name">Name:</label><br>
                <input type="text" name="name" id="name"><br><br>
                <label for="email">Email:</label><br>
                <input type="text" name="email" id="email"><br><br>
                <label for="phone">Phone:</label><br>
                <input type="text" name="phone" id="phone"><br><br>
                <label for="comments">Comments:</label><br>
                <textarea name="comments" id="comments" rows="5" cols="35"></textarea><br><br>
                <label for="appointment">Schedule your tour:</label> <br>
                <input type="datetime-local" id="appointment" name="appointment"><br><br>
                <input type="submit" id="formSubmitButton" value="submit">
            </form>
          </div>
        </div>

        <div id="features">
            <div class="two-column-container">
              <div class="column" id="interior">
                <div class="field-row">
                  <label for="heating_type">Heating type:</label>
                  <div id="heating_type"></div>
                </div>
                <div class="field-row">
                  <label for="cooling_type">Cooling type:</label>
                  <div id="cooling_type"></div>
                </div>
                <div class="field-row">
                  <label for="appliances">Appliances:</label>
                  <div id="appliances"></div>
                </div>
                <div class="field-row">
                  <label for="flooring_type">Flooring type:</label>
                  <div id="flooring_type"></div>
                </div>
                <div class="field-row">
                  <label for="basement">Basement:</label>
                  <div id="basement"></div>
                </div>
                <div class="field-row">
                  <label for="fireplace">Fireplace:</label>
                  <div id="fireplace"></div>
                </div>
              </div>

              <div class="column" id="propertyFacts">
                <div class="field-row">
                  <label for="levels">Number of levels:</label>
                  <div id="levels"></div>
                </div>
                <div class="field-row">
                  <label for="parcel_number">Parcel number:</label>
                  <div id="parcel_number"></div>
                </div>
                <div class="field-row">
                  <label for="special_conditions">Special conditions:</label>
                  <div id="special_conditions"></div>
                </div>
                <div class="field-row">
                  <label for="size_lot">Lot size:</label>
                  <div id="size_lot"></div>
                </div>
                <div class="field-row">
                  <label for="price_per_squarefeet">Price per sqft:</label>
                  <div id="price_per_squarefeet"></div>
                </div>
              </div>
            </div>

            <div class="two-column-container">
              <div class="column" id="construction">
                <div class="field-row">
                  <label for="built_in_year">Built in year:</label>
                  <div id="built_in_year"></div>
                </div>
                <div class="field-row">
                  <label for="home_type">Home type:</label>
                  <div id="home_type"></div>
                </div>
                <div class="field-row">
                  <label for="materials">Materials:</label>
                  <div id="materials"></div>
                </div>
              </div>

              <div class="column" id="utilities">
                <div class="field-row">
                  <label for="sewer_type">Sewer type:</label>
                  <div id="sewer_type"></div>
                </div>
                <div class="field-row">
                  <label for="water_type">Water type:</label>
                  <div id="water_type"></div>
                </div>
              </div>
            </div>
<!--
            <div class="two-column-container">
              <div class="column" id="communityHoa">
                <div class="field-row">
                  <label for="hoa_cost">HOA cost:</label>
                  <div id="hoa_cost"></div>
                </div>
                <div class="field-row">
                  <label for="location">HOA location:</label>
                  <div id="location"></div>
                </div>
              </div>

              <div class="column" id="nearbySchools">
                <div class="field-row">
                  <label for="school_name">School name:</label>
                  <div id="school_name"></div>
                </div>
                <div class="field-row">
                  <label for="school_grade">School grade:</label>
                  <div id="school_grade"></div>
                </div>
                <div class="field-row">
                  <label for="school_distance">School distance:</label>
                  <div id="school_distance"></div>
                </div>
              </div>
              </div>-->
        </div>
    </main>
  </div>
</body>
</html>
